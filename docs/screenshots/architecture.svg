<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="githubGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="actionsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2535"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="renderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="grafanaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1a2e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a9eff" opacity="0.8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00e676" opacity="0.8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">FastAPI DevOps Pipeline — Architecture</text>
  <line x1="200" y1="48" x2="700" y2="48" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ── GITHUB BOX ── -->
  <rect x="50" y="68" width="220" height="100" rx="8" fill="url(#githubGrad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="50" y="68" width="220" height="28" rx="8" fill="#21262d"/>
  <rect x="50" y="88" width="220" height="8" fill="#21262d"/>
  <text x="160" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3" letter-spacing="0.5">⬡  GitHub Repository</text>
  <text x="160" y="116" text-anchor="middle" font-size="10" fill="#8b949e">Branch protection rules</text>
  <text x="160" y="132" text-anchor="middle" font-size="10" fill="#8b949e">PR templates · CODEOWNERS</text>
  <text x="160" y="148" text-anchor="middle" font-size="10" fill="#8b949e">feature branches → main</text>

  <!-- GITHUB → ACTIONS arrow -->
  <line x1="270" y1="118" x2="330" y2="118" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" opacity="0.7"/>
  <text x="300" y="112" text-anchor="middle" font-size="9" fill="#4a9eff" opacity="0.8">push / PR</text>

  <!-- ── GITHUB ACTIONS BOX ── -->
  <rect x="330" y="68" width="240" height="100" rx="8" fill="url(#actionsGrad)" stroke="#1f6feb" stroke-width="1.5"/>
  <rect x="330" y="68" width="240" height="28" rx="8" fill="#0d1117"/>
  <rect x="330" y="88" width="240" height="8" fill="#0d1117"/>
  <text x="450" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#58a6ff" letter-spacing="0.5">⚡  GitHub Actions CI/CD</text>

  <!-- Pipeline steps -->
  <rect x="348" y="104" width="58" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="377" y="119" text-anchor="middle" font-size="9" fill="#f0883e">flake8</text>

  <line x1="406" y1="115" x2="414" y2="115" stroke="#4a9eff" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>

  <rect x="414" y="104" width="58" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="443" y="119" text-anchor="middle" font-size="9" fill="#3fb950">pytest</text>

  <line x1="472" y1="115" x2="480" y2="115" stroke="#4a9eff" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>

  <rect x="480" y="104" width="72" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="516" y="119" text-anchor="middle" font-size="9" fill="#4a9eff">deploy hook</text>

  <text x="450" y="152" text-anchor="middle" font-size="9" fill="#8b949e">auto-deploy on merge to main only</text>

  <!-- ACTIONS → RENDER arrow -->
  <line x1="450" y1="168" x2="450" y2="215" stroke="#00e676" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-green)" opacity="0.7"/>
  <text x="468" y="196" font-size="9" fill="#00e676" opacity="0.8">deploy</text>

  <!-- ── RENDER BOX ── -->
  <rect x="270" y="215" width="360" height="170" rx="8" fill="url(#renderGrad)" stroke="#00e676" stroke-width="1.5" opacity="0.9"/>
  <rect x="270" y="215" width="360" height="28" rx="8" fill="#0a1a10"/>
  <rect x="270" y="235" width="360" height="8" fill="#0a1a10"/>
  <text x="450" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#00e676" letter-spacing="0.5">🚀  Render.com Web Service</text>

  <!-- Docker badge -->
  <rect x="354" y="252" width="192" height="26" rx="5" fill="#0d1b2a" stroke="#1d4ed8" stroke-width="1"/>
  <text x="450" y="269" text-anchor="middle" font-size="10" fill="#60a5fa">🐳  Docker Container (Python 3.11)</text>

  <!-- FastAPI app -->
  <rect x="284" y="288" width="148" height="22" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="358" y="303" text-anchor="middle" font-size="9" fill="#e5e7eb">FastAPI + Uvicorn</text>

  <!-- SQLite -->
  <rect x="468" y="288" width="148" height="22" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="542" y="303" text-anchor="middle" font-size="9" fill="#e5e7eb">SQLite (local fallback)</text>

  <!-- Endpoints row -->
  <text x="290" y="330" font-size="9" fill="#6b7280">Endpoints:</text>
  <rect x="290" y="336" width="38" height="16" rx="3" fill="#1e3a5f" stroke="#1d4ed8" stroke-width="0.8"/>
  <text x="309" y="348" text-anchor="middle" font-size="8" fill="#93c5fd">/</text>

  <rect x="334" y="336" width="42" height="16" rx="3" fill="#1e3a5f" stroke="#1d4ed8" stroke-width="0.8"/>
  <text x="355" y="348" text-anchor="middle" font-size="8" fill="#93c5fd">/stats</text>

  <rect x="382" y="336" width="50" height="16" rx="3" fill="#1e3a5f" stroke="#1d4ed8" stroke-width="0.8"/>
  <text x="407" y="348" text-anchor="middle" font-size="8" fill="#93c5fd">/health</text>

  <rect x="438" y="336" width="56" height="16" rx="3" fill="#14532d" stroke="#166534" stroke-width="0.8"/>
  <text x="466" y="348" text-anchor="middle" font-size="8" fill="#86efac">/metrics</text>

  <rect x="500" y="336" width="68" height="16" rx="3" fill="#3b1f6b" stroke="#6d28d9" stroke-width="0.8"/>
  <text x="534" y="348" text-anchor="middle" font-size="8" fill="#c4b5fd">/dashboard</text>

  <!-- Request logger label -->
  <text x="450" y="378" text-anchor="middle" font-size="9" fill="#6b7280">Request logger middleware → captures every API call</text>

  <!-- ── GRAFANA BOX ── -->
  <rect x="580" y="68" width="280" height="100" rx="8" fill="url(#grafanaGrad)" stroke="#f97316" stroke-width="1.5"/>
  <rect x="580" y="68" width="280" height="28" rx="8" fill="#1a0f00"/>
  <rect x="580" y="88" width="280" height="8" fill="#1a0f00"/>
  <text x="720" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#f97316" letter-spacing="0.5">📊  Grafana Cloud</text>
  <text x="720" y="112" text-anchor="middle" font-size="10" fill="#9ca3af">Infinity plugin reads live JSON</text>
  <text x="720" y="128" text-anchor="middle" font-size="10" fill="#9ca3af">from /stats and /health endpoints</text>
  <text x="720" y="148" text-anchor="middle" font-size="10" fill="#6b7280">Public snapshot → permanent URL</text>

  <!-- Render → Grafana arrow -->
  <path d="M630 215 Q630 155 580 140" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow-purple)" opacity="0.7"/>
  <text x="648" y="185" font-size="9" fill="#f97316" opacity="0.8">JSON polling</text>

  <!-- ── LEGEND ── -->
  <rect x="50" y="420" width="800" height="90" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="450" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#8b949e" letter-spacing="1">TECH STACK</text>

  <!-- Row 1 -->
  <rect x="74" y="452" width="90" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="119" y="466" text-anchor="middle" font-size="9" fill="#58a6ff">FastAPI · Python</text>

  <rect x="174" y="452" width="90" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="219" y="466" text-anchor="middle" font-size="9" fill="#60a5fa">Docker</text>

  <rect x="274" y="452" width="90" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="319" y="466" text-anchor="middle" font-size="9" fill="#3fb950">GitHub Actions</text>

  <rect x="374" y="452" width="90" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="419" y="466" text-anchor="middle" font-size="9" fill="#00e676">Render.com</text>

  <rect x="474" y="452" width="90" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="519" y="466" text-anchor="middle" font-size="9" fill="#f97316">Grafana Cloud</text>

  <rect x="574" y="452" width="90" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="619" y="466" text-anchor="middle" font-size="9" fill="#a78bfa">Prometheus</text>

  <rect x="674" y="452" width="90" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="719" y="466" text-anchor="middle" font-size="9" fill="#f59e0b">SQLAlchemy</text>

  <!-- Row 2 -->
  <text x="119" y="500" text-anchor="middle" font-size="9" fill="#6b7280">API · ORM</text>
  <text x="219" y="500" text-anchor="middle" font-size="9" fill="#6b7280">Containerisation</text>
  <text x="319" y="500" text-anchor="middle" font-size="9" fill="#6b7280">CI/CD</text>
  <text x="419" y="500" text-anchor="middle" font-size="9" fill="#6b7280">Cloud hosting</text>
  <text x="519" y="500" text-anchor="middle" font-size="9" fill="#6b7280">Observability</text>
  <text x="619" y="500" text-anchor="middle" font-size="9" fill="#6b7280">Metrics</text>
  <text x="719" y="500" text-anchor="middle" font-size="9" fill="#6b7280">Database ORM</text>

  <!-- Footer -->
  <text x="450" y="558" text-anchor="middle" font-size="9" fill="#4b5563">github.com/NuclearQuince/fastapi-devops-pipeline · fastapi-devops-pipeline.onrender.com</text>
</svg>
